services:
  - type: web
    name: dream-holidays-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm --workspace apps/api run build && npm --workspace apps/api run db:deploy
    startCommand: npm --workspace apps/api run start:prod
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: AUTO_CREATE_INITIAL_ADMIN
        value: "true"
      - key: INITIAL_ADMIN_NAME
        value: Dream Holidays Admin
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
